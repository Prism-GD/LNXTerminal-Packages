name: Build and publish first DEB

on:
  push:
    branches: [ "main" ]
    paths:
      - "packages/lnxterminal-hello/**"
      - ".github/workflows/build-deb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build package
        run: |
          set -eux
          mkdir -p build
          dpkg-deb --root-owner-group --build packages/lnxterminal-hello build/lnxterminal-hello_0.1.0_all.deb
          dpkg-deb --info build/lnxterminal-hello_0.1.0_all.deb
          dpkg-deb --contents build/lnxterminal-hello_0.1.0_all.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lnxterminal-hello_0.1.0_all
          path: build/lnxterminal-hello_0.1.0_all.deb
          if-no-files-found: error

      - name: Publish package to pool
        run: |
          set -eux
          mkdir -p pool/main/lnxterminal-hello
          install -m 0644 build/lnxterminal-hello_0.1.0_all.deb pool/main/lnxterminal-hello/
          dpkg-scanpackages --arch all pool/main /dev/null > Packages
          gzip -9n -c Packages > Packages.gz
          mkdir -p dists/resolute/main/binary-arm64 dists/resolute/main/binary-armhf
          cp Packages dists/resolute/main/binary-arm64/Packages
          cp Packages.gz dists/resolute/main/binary-arm64/Packages.gz
          cp Packages dists/resolute/main/binary-armhf/Packages
          cp Packages.gz dists/resolute/main/binary-armhf/Packages.gz
          rm Packages Packages.gz

      - name: Commit published package and indexes
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool dists
          if git diff --cached --quiet; then
            echo "No package changes to publish."
          else
            git commit -m "publish: lnxterminal-hello 0.1.0"
            git push
          fi
