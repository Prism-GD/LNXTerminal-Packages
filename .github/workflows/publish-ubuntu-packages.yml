name: Publish Ubuntu .deb packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-ubuntu-packages.yml'

permissions:
  contents: write

jobs:
  publish-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download real Ubuntu packages and dependencies
        run: |
          set -euo pipefail
          mkdir -p staging
          docker run --rm --platform linux/amd64 \
            -v "$PWD/staging:/staging" \
            ubuntu:26.04 bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
              printf "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports resolute main universe\n" > /etc/apt/sources.list
              printf "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports resolute-updates main universe\n" >> /etc/apt/sources.list
              printf "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports resolute-security main universe\n" >> /etc/apt/sources.list
              apt-get -o APT::Architecture=arm64 -o APT::Architectures=arm64 update
              apt-get -o APT::Architecture=arm64 -o APT::Architectures=arm64 install -y --download-only --no-install-recommends nano python3 git curl wget
              find /var/cache/apt/archives -maxdepth 1 -type f -name "*.deb" -exec cp -v {} /staging/ \;
            '

      - name: Install repository metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils

      - name: Validate and arrange package files
        run: |
          set -euo pipefail
          test -n "$(find staging -maxdepth 1 -type f -name '*.deb' -print -quit)"
          mkdir -p pool/main
          while IFS= read -r -d '' file; do
            arch="$(dpkg-deb -f "$file" Architecture)"
            name="$(dpkg-deb -f "$file" Package)"
            version="$(dpkg-deb -f "$file" Version)"
            test "$arch" = "arm64" || test "$arch" = "all" || { echo "Unexpected architecture $arch in $file"; exit 1; }
            dest="pool/main/$name/$version"
            mkdir -p "$dest"
            cp "$file" "$dest/"
            dpkg-deb --info "$dest/$(basename "$file")" >/dev/null
          done < <(find staging -maxdepth 1 -type f -name '*.deb' -print0)
          rm -rf staging
          mkdir -p dists/resolute/main/binary-arm64
          apt-ftparchive packages pool/main > dists/resolute/main/binary-arm64/Packages
          gzip -9c dists/resolute/main/binary-arm64/Packages > dists/resolute/main/binary-arm64/Packages.gz
          apt-ftparchive release dists/resolute > dists/resolute/Release
          echo "Repository metadata generated. Release is unsigned until a signing key is configured."

      - name: Commit and publish packages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool dists
          if git diff --cached --quiet; then
            echo "No package changes to publish."
            exit 0
          fi
          git commit -m "packages: publish Ubuntu Resolute arm64 package set"
          git push
