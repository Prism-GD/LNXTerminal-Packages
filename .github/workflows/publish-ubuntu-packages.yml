name: Publish LNXTerminal packages

on:
  workflow_dispatch:
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/publish-ubuntu-packages.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install APT metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

      - name: Validate and arrange LNXTerminal packages
        run: |
          set -euo pipefail
          mkdir -p packages pool/main
          shopt -s nullglob
          debs=(${debs[@]})

          # Remove old Ubuntu mirror content. Only project-owned packages belong here.
          rm -rf pool/main/*
          mkdir -p dists/resolute/main/binary-arm64 dists/resolute/main/binary-armhf

          for file in "$debs[@]"; do
            arch="$(dpkg-deb -f "$file" Architecture)"
            name="$(dpkg-deb -f "$file" Package)"
            version="$(dpkg-deb -f "$file" Version)"

            case "$name" in
              lnxterminal-*) ;;
              *) echo "Refusing non-LNXTerminal package: $name"; exit 1 ;;
            esac

            case "$arch" in
              arm64|armhf|all) ;;
              *) echo "Unsupported package architecture: $arch"; exit 1 ;;
            esac

            dest="pool/main/$name/$version"
            mkdir -p "$dest"
            cp "$file" "$dest/"
            dpkg-deb --info "$dest/$(basename "$file")" >/dev/null
          done

          apt-ftparchive packages pool/main > dists/resolute/main/binary-arm64/Packages
          gzip -9c dists/resolute/main/binary-arm64/Packages > dists/resolute/main/binary-arm64/Packages.gz
          cp dists/resolute/main/binary-arm64/Packages dists/resolute/main/binary-armhf/Packages
          gzip -9c dists/resolute/main/binary-armhf/Packages > dists/resolute/main/binary-armhf/Packages.gz

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="LNXTerminal" \
            -o APT::FTPArchive::Release::Label="LNXTerminal Packages" \
            -o APT::FTPArchive::Release::Suite="resolute" \
            -o APT::FTPArchive::Release::Codename="resolute" \
            -o APT::FTPArchive::Release::Architectures="arm64 armhf" \
            -o APT::FTPArchive::Release::Components="main" \
            release dists/resolute > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/resolute/Release
          echo "LNXTerminal-only package indexes generated."

      - name: Sign APT repository metadata
        env:
          APT_SIGNING_PRIVATE_KEY: ${{ secrets.APT_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_PRIVATE_KEY" || { echo "Missing APT_SIGNING_PRIVATE_KEY repository secret."; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/lnxterminal-gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s\n' "$APT_SIGNING_PRIVATE_KEY" | gpg --batch --import
          fingerprint="CD1381B2BFF1041A38EF2988B049401FAF0C9C5F"
          gpg --batch --list-secret-keys "$fingerprint" >/dev/null
          gpg --batch --yes --local-user "$fingerprint" --armor --detach-sign \
            --output dists/resolute/Release.gpg dists/resolute/Release
          gpg --batch --yes --local-user "$fingerprint" --clearsign \
            --output dists/resolute/InRelease dists/resolute/Release
          echo "APT Release metadata signed successfully."

      - name: Verify signed repository with APT
        run: |
          set -euo pipefail
          sudo install -d -m 755 /usr/share/keyrings
          sudo gpg --dearmor --yes --output /usr/share/keyrings/lnxterminal-archive-keyring.gpg keys/lnxterminal-archive-keyring.asc
          chmod -R a+rX dists pool
          mkdir -p "$RUNNER_TEMP/lnxterminal-apt-lists/partial"
          printf 'deb [arch=arm64 signed-by=/usr/share/keyrings/lnxterminal-archive-keyring.gpg] file:%s resolute main\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/lnxterminal-test.list"
          sudo apt-get \
            -o Dir::Etc::sourcelist="$RUNNER_TEMP/lnxterminal-test.list" \
            -o Dir::Etc::sourceparts="-" \
            -o Dir::State::lists="$RUNNER_TEMP/lnxterminal-apt-lists" \
            -o APT::Architecture=arm64 update
          echo "APT verified the LNXTerminal repository signature and indexes."

      - name: Commit and publish repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A packages pool dists
          if git diff --cached --quiet; then
            echo "No repository changes to publish."
            exit 0
          fi
          git commit -m "repo: publish LNXTerminal packages only"
          git fetch origin main
          git rebase origin/main
          git push
